[package]
name = "fissile"
version = "0.9.2-dev"
edition = "2024"
rust-version = "1.85"
description = "Steer agents toward leaner files — fewer tokens, architecture intact."
readme = "README.md"
license = "MIT"
repository = "https://github.com/vjovanov/fissile"
homepage = "https://github.com/vjovanov/fissile"
documentation = "https://docs.rs/fissile"
keywords = ["pre-commit", "architecture", "file-size", "agents"]
categories = ["development-tools"]
# The published crate is the library + binary, not the repo: specs, e2e
# fixtures, and workflows stay on GitHub (§GOAL-002-tiny-footprint).
include = [
  "src/**",
  "benches/**",
  "schema/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
]

[profile.release]
# Distributed release binaries are additionally profile-guided-optimized via
# `scripts/pgo-build.sh` (§AR-001-ci.6); a plain `cargo build --release` (and
# `cargo install fissile`) is LTO-only and behaviour-identical.
lto = true
codegen-units = 1

[lib]
name = "fissile"
path = "src/lib.rs"

[[bin]]
name = "fissile"
path = "src/main.rs"

# Cargo does not auto-discover .rs files in subdirectories of `tests/`, so each
# integration test needs its own [[test]] block. fissile stays a single
# published package rather than a workspace with a test-only member.
[[test]]
name = "commands"
path = "tests/integration/commands.rs"

[[test]]
name = "json_schema"
path = "tests/integration/json_schema.rs"

[[test]]
name = "agent_loop"
path = "tests/integration/agent_loop.rs"

[[test]]
name = "config_fixtures"
path = "tests/integration/config_fixtures.rs"

[[test]]
name = "rule_exclusions"
path = "tests/integration/rule_exclusions.rs"

[[test]]
name = "help"
path = "tests/integration/help.rs"

[[test]]
name = "config_discovery"
path = "tests/integration/config_discovery.rs"

[[test]]
name = "public_api_compat"
path = "tests/integration/public_api_compat.rs"

[[test]]
name = "history_e2e"
path = "tests/e2e/history/main.rs"

[dependencies]
# Config is data, not code (§GOAL-002-tiny-footprint): serde + toml parse the
# versioned TOML document. The glob engine and CLI argument parsing are
# hand-rolled to keep the dependency tree auditable on one screen.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Bench-only. The real benchmark body is gated behind the `bench` feature so
# normal build/test jobs compile a no-op bench target and never need Valgrind.
iai-callgrind = { version = "0.16.1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
bench = ["dep:iai-callgrind"]

[[bench]]
name = "instructions"
harness = false
