fissile_exceptions_version = 2

[[exceptions]]
path = "src/lower.rs"
match = "exact"
rules = ["rust"]
kind = "deferred"
max_accepted = { value = 10, unit = "lines" }
until = "the lower module is split"
reason = "The lower module has no extraction boundary yet."

