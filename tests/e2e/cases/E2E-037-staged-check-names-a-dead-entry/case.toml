args = ["check", "--staged", "--no-color"]
exit = 1
git = true
# The commit removes the file the entry accepts, which is the thing being judged.
git_removes = ["src/moved.rs"]
stdout_equals = """
stale: 1 exception accepts a file that is not there [registry: docs/file-size-agent-exceptions.toml]
  The file moved or was deleted, so the entry silences nothing. Remove it with
  `fissile exception remove`, or point it at the path the file moved to.
    src/moved.rs [soft, rule: rust]

`fissile check --staged` rejected this staged snapshot. Remove the exception
entry above, or point it at the path its file moved to. If this command is the
commit hook, bypassing it with `--no-verify` leaves a dead entry in the registry."""
