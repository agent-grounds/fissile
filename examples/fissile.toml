# Example fissile configuration shape.
# Copy to the target repository as `.agent-grounds/fissile.toml`.
#
# Every value is spelled out at its default so the file is editable in place
# without consulting the spec; omitting a field is also legal and takes the same
# default (§DF-002-explicit-config).

fissile_config_version = 1

[scan]
# `check --staged` ignores this and receives its file set from git. `audit`
# walks these roots.
include = ["src", "tests", "benches", "docs", "e2e", "README.md", "CLAUDE.md"]
exclude = [
  "target/**",
  "node_modules/**",
  ".git/**",
  "dist/**",
  "build/**",
  "vendor/**",
  "**/*.lock",
  "**/*.min.*",
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.gif",
  "**/*.webp",
  "**/*.pdf",
]
respect_gitignore = true

[output]
format = "text" # text | json
color = "auto" # auto | always | never
success = "ok"

[exceptions]
# Structured oversized-file rationales. Each entry has a typed ceiling so
# findings resume if the accepted file keeps growing.
soft_registry = "docs/file-size-agent-exceptions.toml"
hard_registry = "docs/file-size-human-exceptions.toml"
stale = "warn" # warn | error | ignore

# A written ceiling is rounded up to this step, so it reads as a decision rather
# than as whatever the file measured the day it was recorded. The same step is
# the slack `audit --stale-exceptions` tolerates before calling a ceiling loose.
# Set a unit to 1 to record exact measurements instead.
[exceptions.bump]
lines = 100
bytes = 4096
tokens = 1000

[tokens]
# Token budgets are opt-in; bytes and lines work without external tooling.
enabled = false
command = ["token-counter", "--count", "{path}"]

# A tuned config names destinations the defaults cannot guess, and says
# something different at each severity: soft asks for a split or recorded debt
# in the current commit; hard says what has to happen before more code lands and
# who to escalate to. Add a citation into this
# repository's own architecture docs if it keeps them — never an ID borrowed
# from another project, which resolves nowhere for the reader who sees it.
#
# Where a message offers the exception route, say what the reason has to
# establish — the constraint that makes splitting illegal, or the boundary that
# is missing — not merely that some reason is required (§DF-004-exception-kind).

[[messages]]
id = "split-rust-soft"
text = """
Split now or record the debt now. Move a cohesive group of items into a sibling module under the same parent, splitting along a responsibility seam, never at the line count.
If no split leaves the design better, record why instead of forcing one: name the constraint that makes splitting illegal (--kind structural), or the module this code belongs in that does not exist yet (--kind deferred, --until naming what retires it):
fissile exception add <path> --severity soft --rule {rule} --kind <kind>
"""

[[messages]]
id = "split-rust-hard"
text = """
Must split before more code lands here: move cohesive groups of items into sibling modules along existing seams, keeping the public surface in the parent. Do not invent an abstraction or shuffle lines to get under the limit.
If you cannot see a safe split, stop and ask a human. A human-reviewed exception is the only other way through, and its reason names the constraint that makes splitting illegal (--kind structural) or the boundary that is missing and what must exist first (--kind deferred):
fissile exception add <path> --severity hard --rule {rule} --kind <kind>
"""

[[messages]]
id = "split-doc-soft"
text = """
Split now or record the debt now. A document this long is usually covering two subjects; move the secondary one into a document of its own and link it from here, cutting at a real section boundary — a link or a citation that stops resolving costs a reader more than the extra lines did.
If the document has to be read as one piece, record it instead — naming what makes it indivisible (--kind structural), or the child document that does not exist yet (--kind deferred, --until naming what retires it):
fissile exception add <path> --severity soft --rule {rule} --kind <kind>
"""

[[messages]]
id = "split-doc-hard"
text = """
Must split before adding more: move whole subjects into linked documents of their own, keeping every citation into this file resolvable. If no split keeps the material coherent, ask a human rather than cutting at an arbitrary heading.
"""

[[messages]]
id = "trim-entrypoint"
text = """
This file is read whole, into every agent session, before any work starts, so each line is paid on every one of those reads. Move depth into a document under docs/ and link it from here; keep this file to what has to arrive before the first line of code is written.
"""

[[messages]]
id = "large-fixture"
text = """
Large fixture data. Generate it at test time or move it out of the source tree; if the corpus has to stay checked in, accept it with a written exception rather than trimming it arbitrarily.
"""

[[messages]]
id = "large-file-default"
text = """
Large file for its type. Exclude it in [scan].exclude if it is generated, vendored, or binary; otherwise give this file type a rule of its own with a limit and guidance that fit it.
"""

[[rules]]
id = "large-file-default"
include = ["**/*"]
exclude = []
unit = "bytes"
soft = 524288
soft_edit_limit = 5
hard = 1048576
message = "large-file-default"

[[rules]]
id = "rust-source"
include = ["src/**/*.rs", "benches/**/*.rs"]
exclude = []
unit = "lines"
soft = 350
soft_edit_limit = 5
hard = 550
count_blank_lines = false
count_comment_lines = true
soft_message = "split-rust-soft"
hard_message = "split-rust-hard"

[[rules]]
id = "generated-rust"
include = ["src/**/*.gen.rs"]
exclude = []
unit = "lines"
soft = 1200
soft_edit_limit = 5
hard = 2000
count_blank_lines = false
count_comment_lines = true
# Explicit priority resolves overlap with broader Rust source rules. Higher wins.
priority = 20
soft_message = "split-rust-soft"
hard_message = "split-rust-hard"

[[rules]]
id = "rust-tests"
include = ["tests/**/*.rs"]
exclude = []
unit = "lines"
soft = 450
soft_edit_limit = 5
hard = 700
count_blank_lines = false
count_comment_lines = true
soft_message = "split-rust-soft"
hard_message = "split-rust-hard"

# Budget follows how a document is read. A citable spec is opened when someone
# needs it and — with stable section IDs — read one section at a time, so its
# total length is not charged to a reader who wanted one declaration. That earns
# it several times the source budget. An entrypoint below is the other mode.
# Add a path to this rule's `exclude` only when it should leave this line budget
# while remaining eligible for the byte catch-all. `[scan].exclude` instead
# removes it from every budget; an exception accepts an overflow of this rule.
[[rules]]
id = "citable-spec"
include = ["docs/**/*.md"]
exclude = []
unit = "lines"
soft = 750
soft_edit_limit = 5
hard = 2000
count_blank_lines = false
count_comment_lines = true
soft_message = "split-doc-soft"
hard_message = "split-doc-hard"

# Read whole into every agent session, so every line is charged on every one of
# those reads. An exact filename outranks a glob on specificity, so the two
# rules need no priority (§FS-001-config.3.2).
[[rules]]
id = "entrypoint"
include = ["README.md", "AGENTS.md", "CLAUDE.md", "skills/**/*.md"]
exclude = []
unit = "lines"
soft = 250
soft_edit_limit = 5
hard = 500
count_blank_lines = false
count_comment_lines = true
message = "trim-entrypoint"

[[rules]]
id = "fixtures"
include = ["tests/fixtures/**", "e2e/cases/**"]
exclude = []
unit = "bytes"
soft = 65536
soft_edit_limit = 5
hard = 262144
message = "large-fixture"
