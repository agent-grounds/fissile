# Legacy [output] choices:
# format: text | json
# color: auto | always | never

grund_config_version = 2
project_name = "fissile"

[schema]
marker = "§"
shorthand = "canonical"
id_format = "{kind}-{number}-{slug}" # placeholders: {kind} required; use {number}, {slug}, or both
slug_pattern = "[a-z0-9][a-z0-9-]*"
number_pattern = "\\d+"
section_separator = "."
heading_depth = "must" # strict | warn | loose

[schema.sources]
languages = ["v1_markdown", "v1_c_family", "v1_go", "v1_python", "v1_ruby"]
declarations = "any-comment"
# `repo` prunes the e2e fixture working trees: they are scenario inputs, not
# project docs, and the E2E-012 fixture is deliberately non-UTF-8.
exclude = ["target/", "node_modules/", ".git/", "dist/", "build/", ".venv/", "repo/"]
respect_gitignore = true

[schema.sources.extensions]
md = "v1_markdown"
rs = "v1_c_family"
go = "v1_go"
java = "v1_c_family"
kt = "v1_c_family"
ts = "v1_c_family"
tsx = "v1_c_family"
js = "v1_c_family"
py = "v1_python"
c = "v1_c_family"
cpp = "v1_c_family"
swift = "v1_c_family"
scala = "v1_c_family"
rb = "v1_ruby"
php = "v1_c_family"
cs = "v1_c_family"

[schema.sources.definitions.v1_markdown]
class = "document"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "none"
docstrings = "off"

[schema.sources.definitions.v1_c_family]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "c-family"
docstrings = "off"

[schema.sources.definitions.v1_go]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "go"
docstrings = "off"

[schema.sources.definitions.v1_python]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "python"
docstrings = "python"

[schema.sources.definitions.v1_ruby]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "ruby"
docstrings = "off"

[schema.notes.lines]
must = 3
may = 1

[schema.notes.columns]
must = 100

[schema.notes.text]
must = true # citation-with-note | citation-only

[schema.kinds.GND]
files = ["docs/grund.md"]

[schema.kinds.GOAL]
files = ["docs/goals.md"]

[schema.kinds.FS]
folders = ["docs/functional-spec"]

[schema.kinds.AR]
folders = ["docs/architecture"]

[schema.kinds.DF]
folders = ["docs/decisions/functional"]

[schema.kinds.DA]
folders = ["docs/decisions/architectural"]

# The two test homes are places, not ID namespaces: a test cites the document
# whose claim it proves and is never cited back.
[schema.kinds.e2e]
folders = ["tests/e2e"]
citable = false

[schema.kinds.integration]
folders = ["tests/integration"]
citable = false

[schema.kinds.RM]
files = ["docs/roadmap.md"]

[schema.kinds.code]
folders = ["docs", "tests", "src"]

[rules.citations]

# A scenario proves the What as a user sees it; one that reads the design is
# not black-box.
[rules.citations.e2e]
must = ["FS"]
should-not = ["AR"]

[rules.citations.integration]
should = ["AR"]

[presentation]
trigger = "$$"
rules = "root"

[presentation.kinds.GND]
title = "Reason for existence"

[presentation.kinds.GOAL]
title = "Outcomes the project is trying to achieve"

[presentation.kinds.FS]
title = "User-visible behavior and requirements"

[presentation.kinds.AR]
title = "System design and technical structure"

[presentation.kinds.DF]
title = "Product behavior decisions and tradeoffs"

[presentation.kinds.DA]
title = "Architecture decisions and tradeoffs"

[presentation.kinds.e2e]
title = "User scenarios: black-box proof of the spec"

[presentation.kinds.integration]
title = "Integration tests: proof that the parts fit as designed"

[presentation.kinds.RM]
title = "Planned milestones and sequencing"

[presentation.fmt]
anchors = "github" # github | gitlab | mkdocs | pandoc | none
links = "index"
exclude = []
