fissile_exceptions_version = 2
[[exceptions]]
path = ".github/workflows/release.yml"
match = "exact"
rules = ["tooling"]
kind = "structural"
max_accepted = { value = 303, unit = "lines" }
until = "indefinite"
reason = """
GitHub resolves a workflow's job graph inside one file — `needs:` cannot name a job in another workflow — so splitting this one would break the release ordering it exists to express. What is extractable already lives in scripts/release/ and the jobs call it; what remains is the graph, and the hard budget still caps its growth.
"""
[[exceptions]]
path = "examples/fissile.toml"
match = "exact"
rules = ["config-toml"]
kind = "structural"
max_accepted = { value = 200, unit = "lines" }
until = "indefinite"
reason = """
This worked example is maintained as one consumable TOML document; a sibling split would no longer represent the artifact users read and copy.
"""
[[exceptions]]
path = "src/templates/fissile.default.toml"
match = "exact"
rules = ["config-toml"]
kind = "structural"
max_accepted = { value = 200, unit = "lines" }
until = "indefinite"
reason = """
The generated default is embedded and maintained as one consumable TOML document; a sibling split would no longer represent the artifact fissile init emits.
"""
[[exceptions]]
path = "docs/functional-spec/FS-004-check-audit.md"
match = "exact"
rules = ["spec-docs"]
kind = "deferred"
max_accepted = { value = 800, unit = "lines" }
until = "§FS-004-check-audit.1.5 moves to a child declaration and this file is back under its soft limit"
reason = """
The boundary is missing: §FS-004-check-audit.1.5 belongs in a child declaration, but none exists yet, and moving it changes coordinates cited across the repository, which a change to the words of a refusal must not carry.
"""
